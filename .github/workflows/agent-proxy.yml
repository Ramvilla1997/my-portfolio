name: Deploy agent proxy

# Deploys the Gemini briefing Worker. It needs three repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY.
# Without them the job tests the Worker and then skips the deploy.

on:
  push:
    branches: [main]
    paths: ['agent-proxy/**', '.github/workflows/agent-proxy.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Worker
        run: node --test agent-proxy/
      - name: Deploy the Worker and its key
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GEMINI_API_KEY != '' }}
        working-directory: agent-proxy
        run: |
          npx --yes wrangler@4 deploy --config wrangler.toml
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config wrangler.toml
      - name: Report skipped deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.GEMINI_API_KEY == '' }}
        run: echo "Secrets not set, so the Worker was tested but not deployed."
